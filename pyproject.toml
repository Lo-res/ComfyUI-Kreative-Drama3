[project]
name = "comfyui-kreative-drama3"
description = "Fork of ComfyUI-Drama3 with Q2_K / Q3_K experts for 32 GB RAM PCs. Fish Audio Drama 3 text to speech, natively in ComfyUI: voice cloning, dialogue and inline cues on cards from 8 GB, plus a native Qwen3-ASR. Built with Fish Audio, not affiliated with it."
version = "0.1.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent", "Environment :: GPU :: NVIDIA CUDA"]
dependencies = []

[project.urls]
Repository = "https://github.com/Lo-res/ComfyUI-Kreative-Drama3"
Documentation = "https://github.com/Lo-res/ComfyUI-Kreative-Drama3#readme"
"Bug Tracker" = "https://github.com/Lo-res/ComfyUI-Kreative-Drama3/issues"

[tool.comfy]
PublisherId = ""        # Lo's Registry publisher ID, still to be created
DisplayName = "Kreative Drama 3 (Q2_K / Q3_K)"
requires-comfyui = ">=0.40.0"
